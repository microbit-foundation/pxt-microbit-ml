name: Build MakeCode Project

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'

jobs:
  build-project:
    name: Build MakeCode Project
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
    - run: npm install -g npm@11 --registry=https://registry.npmjs.org
    - name: Install dependencies
      run: |
        npm install -g pxt
        pxt target microbit --no-save
        pxt install
    - name: Build project cloud compiler
      run: pxt build --cloud
      env:
        CI: true